org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Fix: Kotlin incremental compilation breaks on Windows when the Flutter Pub
# cache (C:\Users\...\Pub\Cache) and the project (D:\...) are on different drives.
# Disabling incremental compilation resolves the "different roots" crash.
kotlin.incremental=false
kotlin.incremental.java=false
